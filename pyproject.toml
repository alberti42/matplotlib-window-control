[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "matplotlib-window-control"
version = "0.1.0"
description = "Position, size, displays, stacking and move/resize events for Matplotlib figure windows, on every GUI backend"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Andrea Alberti" }]
dependencies = [
  "matplotlib>=3.8",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gui: opens native windows; skipped unless MWC_GUI_TESTS=1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/matplotlib_window_control"]
